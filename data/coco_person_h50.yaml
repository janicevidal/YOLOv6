# COCO 2017 dataset http://cocodataset.org

# If you are using Windows system,
# the dataset path should be like this:
# train: d:\dataset\coco\images\train2017
# because windows use "\" as separator, linux use "/" as separator.

train: /data/zhangxiaoshuai/HumanDetection/coco_person/images/train2017
val: /data/zhangxiaoshuai/HumanDetection/coco_person/images/val2017  # 5000 images
test: ../coco/images/test2017
anno_path: /data/zhangxiaoshuai/HumanDetection/coco_person/annotations/instances_val2017_person.json

# number of classes
nc: 1
# whether it is coco dataset, only coco dataset should be set to True.
is_coco: True

# class names
names: [ 'person', ]
